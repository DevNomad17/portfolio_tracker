name: Update prices and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 17 * * 1-5"   # 17:15 UTC on weekdays, after Borsa Italiana close
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Run tests
        run: python -m unittest discover tests
      - name: Update prices and build site
        run: python -m tracker all
      - name: Commit refreshed price cache
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices
          git diff --cached --quiet || git commit -m "Price cache $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
